<script>
/* ============ ابزارها ============ */
const $=s=>document.querySelector(s);
const FD='۰۱۲۳۴۵۶۷۸۹';
const faD=s=>String(s).replace(/\d/g,d=>FD[d]);
const fa=n=>Math.round(Number(n)||0).toLocaleString('fa-IR');
const toEn=s=>String(s).replace(/[۰-۹]/g,d=>FD.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[٬,،\s]/g,'');

const JM=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const T=Math.trunc;

/* تبدیل تاریخ شمسی/میلادی */
function g2j(gy,gm,gd){
  const gdm=[0,31,59,90,120,151,181,212,243,273,304,334];
  let jy;
  if(gy>1600){jy=979;gy-=1600}else{jy=0;gy-=621}
  const gy2=gm>2?gy+1:gy;
  let days=365*gy+T((gy2+3)/4)-T((gy2+99)/100)+T((gy2+399)/400)-80+gd+gdm[gm-1];
  jy+=33*T(days/12053);days%=12053;
  jy+=4*T(days/1461);days%=1461;
  if(days>365){jy+=T((days-1)/365);days=(days-1)%365}
  const jm=days<186?1+T(days/31):7+T((days-186)/30);
  const jd=1+(days<186?days%31:(days-186)%30);
  return [jy,jm,jd];
}
function j2g(jy,jm,jd){
  let gy;
  if(jy>979){gy=1600;jy-=979}else{gy=621}
  let days=365*jy+T(jy/33)*8+T((jy%33+3)/4)+78+jd+(jm<7?(jm-1)*31:(jm-7)*30+186);
  gy+=400*T(days/146097);days%=146097;
  if(days>36524){gy+=100*T(--days/36524);days%=36524;if(days>=365)days++}
  gy+=4*T(days/1461);days%=1461;
  if(days>365){gy+=T((days-1)/365);days=(days-1)%365}
  let gd=days+1;
  const sa=[0,31,(gy%4===0&&gy%100!==0)||gy%400===0?29:28,31,30,31,30,31,31,30,31,30,31];
  let gm;
  for(gm=0;gm<13&&gd>sa[gm];gm++)gd-=sa[gm];
  return [gy,gm,gd];
}
const isoOf=(y,m,d)=>`${y}-${pad(m)}-${pad(d)}`;
const todayISO=()=>{const t=new Date();return isoOf(t.getFullYear(),t.getMonth()+1,t.getDate())};
const j2iso=(y,m,d)=>{const g=j2g(y,m,d);return isoOf(g[0],g[1],g[2])};
const iso2j=s=>{const p=s.split('-').map(Number);return g2j(p[0],p[1],p[2])};
const jLen=(y,m)=>m<=6?31:m<=11?30:(iso2j(j2iso(y,12,30))[1]===12?30:29);
const fmtD=s=>{const j=iso2j(s);return `${faD(j[2])} ${JM[j[1]-1]} ${faD(j[0])}`};
function addM(s,k){const j=iso2j(s);const t=j[0]*12+j[1]-1+k;const y=Math.floor(t/12),m=t%12+1;return j2iso(y,m,Math.min(j[2],jLen(y,m)))}
const addDays=(s,k)=>{const p=s.split('-').map(Number);return new Date(Date.UTC(p[0],p[1]-1,p[2]+k)).toISOString().slice(0,10)};
const daysBetween=(a,b)=>{const p=a.split('-').map(Number),q=b.split('-').map(Number);return Math.round((Date.UTC(q[0],q[1]-1,q[2])-Date.UTC(p[0],p[1]-1,p[2]))/864e5)};
const curJ=()=>{const j=iso2j(todayISO());return {y:j[0],m:j[1]}};
const range=v=>[j2iso(v.y,v.m,1),v.m===12?j2iso(v.y+1,1,1):j2iso(v.y,v.m+1,1)];

function groupCat(l,ty){
  const m={};
  l.filter(t=>t.type===ty).forEach(t=>{(m[t.cat]=m[t.cat]||{key:t.cat,total:0}).total+=t.amount});
  return Object.values(m).map(x=>{const c=catOf(x.key);return Object.assign({},x,{name:c?c.name:'بدون دسته',icon:c?c.icon:'❔'})}).sort((a,b)=>b.total-a.total);
}
function loanInfo(l){
  const paid=l.paid||{};
  const sched=[];for(let i=0;i<l.count;i++)sched.push({i,due:addM(l.start,i),paid:!!paid[i]});
  const paidN=sched.filter(s=>s.paid).length;
  return {paidN,sched,next:sched.find(s=>!s.paid),remaining:(l.count-paidN)*l.amount};
}
function dues(sp){
  const t=todayISO(),out=[];
  S.loans.filter(l=>!sp||l.space===sp).forEach(l=>{
    loanInfo(l).sched.forEach(s=>{
      if(s.paid)return;
      const days=daysBetween(t,s.due);
      if(days<=S.settings.remind)out.push({l,i:s.i,due:s.due,days});
    });
  });
  return out.sort((a,b)=>a.days-b.days);
}

function txRow(t){

  const sm=(t.sub&&c?c.name+' · ':'')+(t.note||fmtD(t.date));

}
const barRow=(x,tot,d)=>`<div class="bar"><div class="bl"><span>${x.icon} ${esc(x.name)}</span><b>${fa(x.total)}${d||''}</b></div><div class="track"><i style="width:${Math.max(3,x.total/tot*100)}%"></i></div></div>`;
const sortTx=l=>l.sort((a,b)=>a.date===b.date?b.ts-a.ts:(a.date<b.date?1:-1));

function listBody(){

function vReport(){
  const sp=space(),ms=[];
  for(let k=-5;k<=0;k++){const v=shiftM(view,k),l=mtx(sp,v);ms.push({v,inc:sum(l,'inc'),exp:sum(l,'exp')})}
  const mx=Math.max(1,...ms.map(m=>Math.max(m.inc,m.exp)));
  const l=mtx(sp,view),pl=mtx(sp,shiftM(view,-1));
  const cg=groupCat(l,repType),pg=groupCat(pl,repType);
  const cur=sum(l,repType),prev=sum(pl,repType);
  let ins='';
  if(!cur&&!prev)ins='هنوز داده‌ای برای مقایسه نیست.';
  else if(!prev)ins=`ماه قبل داده‌ای نداشتی؛ این ماه ${fa(cur)} تومان ${repType==='exp'?'هزینه':'درآمد'} ثبت شده.`;
  else{const p=Math.round((cur-prev)/prev*100);ins=`${repType==='exp'?'هزینه':'درآمد'} این ماه ${p===0?'تقریباً برابر':faD(Math.abs(p))+'٪ '+(p>0?'بیشتر':'کمتر')+' از'} ماه قبل است (${fa(prev)} ← ${fa(cur)} تومان).`}
  return monthNav()+
   `<div class="card"><h4>شش ماه اخیر</h4><div class="cols">${ms.map((m,i)=>`<div class="col ${i===5?'cur':''}"><div class="pair"><i class="n" style="height:${m.inc/mx*100}%"></i><i class="e" style="height:${m.exp/mx*100}%"></i></div><div>${compact(m.exp)}</div><div>${JM[m.v.m-1]}</div></div>`).join('')}</div>
    <div class="legend"><span><b style="background:var(--inc)"></b>درآمد</span><span><b style="background:var(--exp)"></b>هزینه (عدد زیر ستون)</span></div></div>`+
   `<div class="seg2" style="margin:12px 16px"><button class="${repType==='exp'?'on exp':''}" data-act="rtype" data-v="exp">هزینه‌ها</button><button class="${repType==='inc'?'on inc':''}" data-act="rtype" data-v="inc">درآمدها</button></div>
    <div class="card insight">${ins}</div>`+
   `<div class="card"><h4>پول‌ها کجا می‌رود؟</h4>${cg.length?cg.map(x=>{
      const pv=(pg.find(y=>y.key===x.key)||{}).total||0;let d='';
      if(pv){const p=Math.round((x.total-pv)/pv*100);if(p!==0){const bad=(p>0)===(repType==='exp');d=`<span class="delta ${bad?'bad':'good'}">${p>0?'▲':'▼'} ${faD(Math.abs(p))}٪</span>`}}
      else d=`<span class="delta muted">جدید</span>`;
      return barRow(x,cur||1,d);
    }).join(''):'<div class="empty">داده‌ای برای این ماه نیست</div>'}</div>`;
}
function loanCard(l){
  const f=loanInfo(l),pct=f.paidN/l.count*100;
  let nx='همه پرداخت شد ✓';
  if(f.next){const d=daysBetween(todayISO(),f.next.due);nx=`سررسید بعدی: ${fmtD(f.next.due)}${d<0?` (${faD(-d)} روز معوق)`:d===0?' (امروز)':` (${faD(d)} روز دیگر)`}`}
  return `<div class="card" data-act="loan-open" data-id="${l.id}"><div class="row" style="border:0;padding:0"><div class="ic">${l.kind==='single'?'🧾':'💳'}</div><div class="mid"><b>${esc(l.title)}</b><small>${l.kind==='single'?'پرداختی تکی':faD(f.paidN)+' از '+faD(l.count)+' قسط'} · ${fa(l.amount)} تومان</small></div></div>
   <div class="track" style="margin:12px 0 8px"><i style="width:${pct}%"></i></div><small class="muted">${nx}</small></div>`;
}

function openSheet(fn){
  curSheet=fn;const s=$('#sheet');
  s.innerHTML=`<div class="sheet-bg" data-act="close"></div><div class="sheet"><div class="grab"></div><div id="sc">${fn()}</div></div>`;
  s.classList.add('open');document.body.style.overflow='hidden';

function dateSel(bind,isoV,b,a){
  const j=iso2j(isoV),cy=curJ().y,y0=Math.min(cy-b,j[0]),y1=Math.max(cy+a,j[0]);
  let ys='',ms='',ds='';
  for(let i=y0;i<=y1;i++)ys+=`<option value="${i}" ${i===j[0]?'selected':''}>${faD(i)}</option>`;
  for(let i=1;i<=12;i++)ms+=`<option value="${i}" ${i===j[1]?'selected':''}>${JM[i-1]}</option>`;
  for(let i=1;i<=jLen(j[0],j[1]);i++)ds+=`<option value="${i}" ${i===j[2]?'selected':''}>${faD(i)}</option>`;
  return `<div class="dsel" data-for="${bind}"><select data-dpart="d">${ds}</select><select data-dpart="m">${ms}</select><select data-dpart="y">${ys}</select></div>`;
}

function ceHtml(){
  return `<h3>${CE.id?'ویرایش دسته':'دسته جدید'} (${CE.type==='exp'?'هزینه':'درآمد'})</h3>
  <label>نام</label><input data-bind="CE.name" value="${esc(CE.name)}">
  <label>آیکون (یک ایموجی)</label><input data-bind="CE.icon" value="${esc(CE.icon)}" maxlength="4">
  <label>زیرمجموعه‌ها (با ویرگول جدا کن)</label><input data-bind="CE.subs" value="${esc(CE.subs)}" placeholder="مثلاً: بنزین، تاکسی">
  <div class="btns"><button class="btn pri" data-act="ce-save">ذخیره</button>${CE.id?'<button class="btn danger" data-act="ce-del">حذف</button>':''}</div>`;
}

/* ============ فایل و تقویم ============ */
function saveFile(name,mime,text){
  const blob=new Blob([text],{type:mime});
  try{const file=new File([blob],name,{type:mime});
    if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:name}).catch(()=>{});return}}catch(e){}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},3000);
}
function icsText(loans){
  const n=S.settings.remind,trig=n===0?'PT9H':`-PT${24*n-9}H`;
  const st=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z',ev=[];
  loans.forEach(l=>{for(let i=0;i<l.count;i++){
    if(l.paid&&l.paid[i])continue;
    const d=addM(l.start,i),sm=`${l.title}${l.count>1?' - قسط '+faD(i+1):''}`;
    ev.push(['BEGIN:VEVENT',`UID:${l.id}-${i}@hesab`,`DTSTAMP:${st}`,`DTSTART;VALUE=DATE:${d.replace(/-/g,'')}`,`DTEND;VALUE=DATE:${addDays(d,1).replace(/-/g,'')}`,
      `SUMMARY:${sm}`,`DESCRIPTION:مبلغ: ${fa(l.amount)} تومان`,'BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:${sm}`,`TRIGGER:${trig}`,'END:VALARM','END:VEVENT'].join('\r\n'));
  }});
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//hesab//FA//EN','CALSCALE:GREGORIAN',...ev,'END:VCALENDAR'].join('\r\n');
}
function notifyDues(){
  try{
    if(!('Notification' in window)||Notification.permission!=='granted')return;
    const t=todayISO();if(S.settings.lastNotif===t)return;
    const dl=dues(null);if(!dl.length)return;
    S.settings.lastNotif=t;save();
    new Notification('⏰ سررسید پرداخت',{body:dl.slice(0,3).map(x=>`${x.l.title} — ${x.days<0?'معوق':x.days===0?'امروز':faD(x.days)+' روز دیگر'}`).join('\n')});
  }catch(e){}
}

/* ============ هوش مصنوعی ============ */
function toB64(file,max){
  return new Promise((res,rej)=>{
    const u=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{let w=im.width,h=im.height;const s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);
      const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);URL.revokeObjectURL(u);
      res(c.toDataURL('image/jpeg',.85).split(',')[1])};
    im.onerror=()=>rej(new Error('تصویر خوانده نشد'));im.src=u;
  });
}
async function aiRead(file){
  const key=(S.settings.apiKey||'').trim();
  if(!key)throw new Error('کلید API در تنظیمات وارد نشده');
  const b64=await toB64(file,1600);
  const list=cats().map(c=>`${c.id} = ${c.name} (${c.type==='inc'?'income':'expense'})`).join('\n');
  const prompt=`This image is an Iranian receipt, POS slip, invoice, or a bank-app screenshot of a transfer/payment (Persian text).
Extract the transaction and answer with ONLY one JSON object, no other text:
{"type":"expense"|"income","amount":<number, English digits, no separators>,"unit":"rial"|"toman","date":"YYYY/MM/DD Jalali date as shown, or null","title":"short Persian description: store name, or who was paid / who paid","category_id":"best matching id from the list, or null"}
Rules: "income" only if money was received (واریز به حساب). Money the user paid or transferred out is "expense". Use "rial" unless the document clearly says تومان. Convert all Persian digits to English digits.
Categories:
${list}`;
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',
    headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:S.settings.model||'claude-sonnet-5-5',max_tokens:500,messages:[{role:'user',content:[{type:'image',source:{type:'base64',media_type:'image/jpeg',data:b64}},{type:'text',text:prompt}]}]})});
  if(!r.ok){let m='';try{m=(await r.json()).error.message}catch(e){}throw new Error(r.status===401?'کلید API نامعتبر است':(m||'خطای سرور '+r.status))}
  const data=await r.json();
  const txt=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('');
  const m=txt.match(/\{[\s\S]*\}/);if(!m)throw new Error('پاسخ قابل فهم نبود');
  const j=JSON.parse(m[0]);
  let amt=Number(toEn(String(j.amount||0)))||0;if(j.unit==='rial')amt=Math.round(amt/10);
  let date=todayISO();
  if(j.date){const dm=toEn(j.date).match(/(\d{3,4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/);
    if(dm){const y=+dm[1],mo=+dm[2],d=+dm[3];try{if(mo>=1&&mo<=12&&d>=1&&d<=31)date=y>1300&&y<1500?j2iso(y,mo,Math.min(d,jLen(y,mo))):(y>1900?isoOf(y,mo,d):date)}catch(e){}}}
  const ty=j.type==='income'?'inc':'exp';
  const ok=cats().some(c=>c.id===j.category_id&&c.type===ty);
  return {type:ty,amount:amt,cat:ok?j.category_id:'',sub:'',date,note:String(j.title||'').slice(0,80),ai:true};
}
function nextDraft(){const d=draftQ.shift();if(d)openTxForm(null,d);else closeSheet()}

/* ============ رویدادها ============ */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const d=el.dataset;
  switch(d.act){
    case 'close':closeSheet();break;
    case 'tab':tab=d.tab;render();window.scrollTo(0,0);break;
    case 'space':S.settings.space=d.space;save();filterType='all';q='';render();window.scrollTo(0,0);break;
    case 'mnav':view=shiftM(view,+d.d);render();break;
    case 'filter':filterType=d.v;render();break;
    case 'rtype':repType=d.v;render();break;
    case 'add':openTxForm();break;
    case 'edit-tx':{const t=S.tx.find(x=>x.id===d.id);if(t)openTxForm(t);break}
    case 'ftype':F.type=d.v;F.cat='';F.sub='';reSheet();break;
    case 'fcat':F.cat=d.id;F.sub='';reSheet();break;
    case 'fsub':F.sub=F.sub===d.v?'':d.v;reSheet();break;
    case 'fsave':{
      if(!F.amount||F.amount<=0){toast('مبلغ را وارد کن');break}
      if(!F.cat){toast('یک دسته‌بندی انتخاب کن');break}
      if(F.id){const i=S.tx.findIndex(t=>t.id===F.id);S.tx[i]=Object.assign({},S.tx[i],{type:F.type,amount:F.amount,cat:F.cat,sub:F.sub||'',date:F.date,note:F.note||''})}
      else S.tx.push({id:uid(),space:space(),ts:Date.now(),type:F.type,amount:F.amount,cat:F.cat,sub:F.sub||'',date:F.date,note:F.note||''});
      const j=iso2j(F.date);view={y:j[0],m:j[1]};save();toast('ذخیره شد ✓');
      if(draftQ.length)nextDraft();else closeSheet();
      render();break}
    case 'fdel':if(confirm('این تراکنش حذف شود؟')){S.tx=S.tx.filter(t=>t.id!==F.id);save();closeSheet();render();toast('حذف شد')}break;
    case 'scan':
      if(!(S.settings.apiKey||'').trim()){toast('اول کلید API را در تنظیمات وارد کن',3200);closeSheet();tab='settings';render();break}
      $('#scan').click();break;
    case 'loan-add':openLoanForm();break;
    case 'lkind':L.kind=d.v;if(d.v==='single')L.count=1;else if(L.count<2)L.count=12;reSheet();break;
    case 'lsave':{
      if(!L.title.trim()){toast('عنوان را بنویس');break}
      if(!L.amount||L.amount<=0){toast('مبلغ را وارد کن');break}
      const cnt=L.kind==='single'?1:Math.min(Math.max(L.count|0,1),360);
      S.loans.push({id:uid(),space:space(),title:L.title.trim(),kind:L.kind,amount:L.amount,count:cnt,start:L.start,paid:{},note:''});
      save();closeSheet();render();toast('ثبت شد ✓');break}
    case 'loan-open':openSheet(()=>loanHtml(d.id));break;
    case 'pay':{
      const l=S.loans.find(x=>x.id===d.id),i=+d.i;l.paid=l.paid||{};
      if(l.paid[i]){const tid=l.paid[i];S.tx=S.tx.filter(t=>t.id!==tid);delete l.paid[i]}
      else{const tx={id:uid(),space:l.space,ts:Date.now(),type:'exp',amount:l.amount,cat:'loan',sub:'',date:todayISO(),note:l.title+(l.count>1?' - قسط '+faD(i+1):'')};S.tx.push(tx);l.paid[i]=tx.id}
      save();reSheet();render();break}
    case 'loan-del':if(confirm('این مورد حذف شود؟ (هزینه‌های ثبت‌شده باقی می‌مانند)')){S.loans=S.loans.filter(l=>l.id!==d.id);save();closeSheet();render()}break;
    case 'ics':{const l=S.loans.find(x=>x.id===d.id);saveFile('hesab-'+l.id+'.ics','text/calendar',icsText([l]));break}
    case 'ics-all':{const ls=S.loans.filter(l=>l.space===space());if(!ls.length){toast('موردی برای خروجی نیست');break}saveFile('hesab-installments.ics','text/calendar',icsText(ls));break}
    case 'notif':
      if(!('Notification' in window)){toast('این حالت اعلان را پشتیبانی نمی‌کند. «خروجی تقویم» را استفاده کن.',4200);break}
      Notification.requestPermission().then(p=>{toast(p==='granted'?'اعلان فعال شد (هنگام باز کردن برنامه نمایش داده می‌شود)':'اجازه داده نشد',3500);notifyDues()});break;
    case 'set-dark':S.settings.dark=d.v;save();render();break;
    case 'cat-new':CE={id:'',type:d.type,name:'',icon:'🏷️',subs:''};openSheet(ceHtml);break;
    case 'cat-edit':{const c=catOf(d.id);CE={id:c.id,type:c.type,name:c.name,icon:c.icon,subs:c.subs.join('، ')};openSheet(ceHtml);break}
    case 'ce-save':{
      if(!CE.name.trim()){toast('نام دسته را بنویس');break}
      const subs=CE.subs.split(/[,،]/).map(s=>s.trim()).filter(Boolean);
      if(CE.id){const c=catOf(CE.id);c.name=CE.name.trim();c.icon=CE.icon||'🏷️';c.subs=subs}
      else cats().push({id:uid(),type:CE.type,name:CE.name.trim(),icon:CE.icon||'🏷️',subs});
      save();closeSheet();render();break}
    case 'ce-del':if(confirm('این دسته حذف شود؟ تراکنش‌های قبلی با برچسب «بدون دسته» می‌مانند.')){S.cats[space()]=cats().filter(c=>c.id!==CE.id);save();closeSheet();render()}break;
    case 'export':{
      const c=JSON.parse(JSON.stringify(S));c.settings.apiKey='';
      saveFile('hesab-backup-'+todayISO()+'.json','application/json',JSON.stringify(c));break}
    case 'import':$('#imp').click();break;
    case 'reset':if(confirm('همه اطلاعات پاک شود؟ این کار برگشت‌پذیر نیست.')&&confirm('مطمئنی؟ حتماً قبلش پشتیبان بگیر.')){const k=S.settings.apiKey;S=fresh();S.settings.apiKey=k;save();render();toast('پاک شد')}break;
  }
});
function onField(t){
  if(t.id==='q'){q=t.value;$('#listbody').innerHTML=listBody();return true}
  if(t.dataset.set){S.settings[t.dataset.set]=t.dataset.set==='remind'?+t.value:t.value;save();return true}
  const b=t.dataset.bind;
  if(b){
    const o=b.split('.')[0],k=b.split('.')[1],obj={F:F,L:L,CE:CE}[o];if(!obj)return true;
    if(t.dataset.num){const n=Number(toEn(t.value))||0;obj[k]=n;t.value=n?n.toLocaleString('en-US'):''}
    else obj[k]=t.value;
    return true;
  }
  return false;
}
document.addEventListener('input',e=>onField(e.target));
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.dpart){
    const w=t.closest('.dsel'),o=w.dataset.for.split('.')[0],k=w.dataset.for.split('.')[1],obj={F:F,L:L}[o];
    const y=+w.querySelector('[data-dpart=y]').value,m=+w.querySelector('[data-dpart=m]').value;
    const d=Math.min(+w.querySelector('[data-dpart=d]').value,jLen(y,m));
    obj[k]=j2iso(y,m,d);reSheet();return;
  }
  onField(t);
});
$('#scan').addEventListener('change',async e=>{
  const fs=[...e.target.files];e.target.value='';if(!fs.length)return;
  setBusy(true,'در حال خواندن رسید…');let fail=0,err='';
  for(let i=0;i<fs.length;i++){
    $('#busytxt').textContent=`در حال خواندن رسید ${faD(i+1)} از ${faD(fs.length)}…`;
    try{draftQ.push(await aiRead(fs[i]))}catch(x){fail++;err=x.message||'خطا'}
  }
  setBusy(false);
  if(fail)toast('خطا: '+err+(fs.length>1?` (${faD(fail)} مورد ناموفق)`:''),5000);
  if(draftQ.length)nextDraft();
});
$('#imp').addEventListener('change',e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const d=JSON.parse(rd.result);
      if(!d.cats||!Array.isArray(d.tx))throw 0;
      if(!confirm('اطلاعات فعلی با این پشتیبان جایگزین شود؟'))return;
      const k=S.settings.apiKey;S=Object.assign(fresh(),d);S.settings=Object.assign(fresh().settings,d.settings||{});S.settings.apiKey=k;
      save();render();toast('بازیابی شد ✓');
    }catch(x){toast('فایل پشتیبان معتبر نیست')}
  };
  rd.readAsText(f);
});
if(window.matchMedia)matchMedia('(prefers-color-scheme: dark)').addEventListener&&matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(S.settings.dark==='auto')applyTheme()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)notifyDues()});

/* آیکون صفحه اصلی آیفون */
(function(){try{
  const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d');
  x.fillStyle='#0f3d3a';x.fillRect(0,0,180,180);
  x.font='96px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('💰',90,96);
  const l=document.createElement('link');l.rel='apple-touch-icon';l.href=c.toDataURL('image/png');document.head.appendChild(l);
}catch(e){}})();

render();
notifyDues();
</script>
